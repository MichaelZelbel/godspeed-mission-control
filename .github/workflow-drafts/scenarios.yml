      - name: The scenario, the stage's own copy of it
        shell: bash
        run: bash scenarios/capture-scenario-result.sh first-day "$STAGE_REF"
      - name: Keep what the scenario saw (the work, the brief, every request)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-day-evidence
