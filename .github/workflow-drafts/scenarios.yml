name: scenarios
# The run's name carries the stage it proved, so a run on a candidate's tag that was left at the
# default stage (beta) cannot be read as that candidate's pass: GitHub shows the input itself only
# in the run's logs.
run-name: ${{ github.event_name == 'pull_request' && format('scenarios on pull request {0}', github.event.pull_request.number) || format('scenarios {0}', inputs.stage || 'main, the night') }}
# The proving scenarios a candidate runs before the maintainer is asked for "go" (godspeed-dev,
# releases/godspeed-2.0.0-beta.7-stages/plan.md, "Proving scenarios" 1, 2 and 5, and
# releases/godspeed-2.0.0-beta.8-faster-chat/plan.md, "Proving scenarios" 1, 3 and 4, which are
# scripts in scenarios/; its scenario 2, the night chat tidy-up, left the release with the tidy-up
# on 27 October 2026). Started by hand on the candidate's own tag, with the same tag as the stage
# to prove: --ref candidate/2.0.0-beta.8 -f stage=candidate/2.0.0-beta.8 (or beta, or main).
# Candidate and nightly checks share one native and one Docker installation, restoring their mutable
# state between checks; update and move checks keep isolated installations. Pull requests still run
# each changed script alone. Every check ends with PASS <name> or FAIL <name>: <what it saw>.
# Every night on main (process.md section 5): the Linux and Docker jobs. The Mac and Windows jobs
# are for a candidate (the Mac one only when `inputs.mac` is true, the Windows one only on a
# candidate's tag), which a scheduled run never is. The verdict job's last step then tells the night
# in issues (scenarios/report-night.mjs, releases/godspeed-2.0.0-beta.15-nightly-proof-six-repairs).
# A pull request that changes a scenario's own script runs that scenario on the pull request's own
# code (the job `stage` reads the changed files and says which scenarios to run: `picked`), so a fix
# to a scenario is proved red or green before it merges instead of on the next night or candidate.
# Nothing else runs on a pull request: no Mac, no Windows, no scenario whose files the pull request
# did not touch (and never the install, Docker or update jobs), no issue in the night's name; a pull request from a fork runs nothing (no secrets).
# A newer commit on the same pull request cancels the older run.
# A night proves main's own commit: with no `stage` input (the schedule) the stage is made from
# github.sha by scenarios/stage-for-run.sh and handed to every job as the artifact run-stage, read as
# file://; main's own stage.json names the last frozen version and is never read.
on:
  schedule:
    - cron: '30 2 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stage:
        description: The stage to prove (a branch or tag holding stage.json, e.g. candidate/2.0.0-beta.7)
        required: true
        default: beta
      mac:
        description: Also install on a Mac (once per candidate)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # One group per pull request, so a new commit cancels the older run; every other run has its own.
  group: scenarios-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Without a stage (the night) the stage is this commit's, in a folder every job downloads to
  # $RUNNER_TEMP/run-stage (GitHub's Ubuntu runners keep that at /home/runner/work/_temp).
  STAGE_REF: ${{ inputs.stage || 'this-commit' }}
  RAW: ${{ inputs.stage && 'https://raw.githubusercontent.com/MichaelZelbel/godspeed-mission-control' || 'file:///home/runner/work/_temp/run-stage' }}
  GODSPEED_SCENARIO_RAW: ${{ inputs.stage && 'https://raw.githubusercontent.com/MichaelZelbel/godspeed-mission-control' || 'file:///home/runner/work/_temp/run-stage' }}
jobs:
  stage:
    name: the stage file
    # A pull request from a fork has no secrets, so no scenario can run on it: nothing runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      # The commit the run proves: a pull request's own head, otherwise the one the run started on.
      PROOF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      picked: ${{ steps.pick.outputs.picked }}
      version: ${{ steps.read.outputs.version }}
      product: ${{ steps.read.outputs.product }}
      engine: ${{ steps.read.outputs.engine }}
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ inputs.stage && 1 || 50 }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22.19.0' }
      - name: This commit's own stage (no stage given, the night)
        if: ${{ !inputs.stage }}
        run: |
          set -e
          out=$(bash scenarios/stage-for-run.sh '' "$PROOF_SHA" "$RUNNER_TEMP/run-stage")
          echo "$out"
          [ "$out" = "$(printf 'ref=%s\nraw=%s' "$STAGE_REF" "$RAW")" ] || { echo "the stage is not where the jobs will read it ($RAW)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
          include-hidden-files: true
          retention-days: 3
      - name: Which scenarios this run proves
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "picked=all" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request owns script files and their companions; shared pooling inputs prove every
          # standalone scenario because every one depends on that orchestration.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed"
          picked=$(bash scenarios/pick-scenarios.sh "$RUNNER_TEMP/changed")
          echo "The pull request changes $(wc -l < "$RUNNER_TEMP/changed") files; scenarios picked:$picked" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "picked=$picked" | tee -a "$GITHUB_OUTPUT"
      - name: Read and check it
        id: read
        run: |
          set -e
          f=stage.json; [ -n "$INPUT_STAGE" ] || f="$RUNNER_TEMP/run-stage/this-commit/stage.json"
          node stage/stage.mjs "$f" check
          {
            echo "version=$(node stage/stage.mjs "$f" get version)"
            echo "product=$(node stage/stage.mjs "$f" get productCommit)"
            echo "engine=$(node stage/stage.mjs "$f" get kitBootstrap.unixEngineCommit)"
            echo "image=$(node stage/stage.mjs "$f" get serverEditions.server.image)"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          INPUT_STAGE: ${{ inputs.stage }}

  pooled:
    name: the installed Linux and Docker scenarios
    if: ${{ github.event_name != 'pull_request' }}
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GODSPEED_SCENARIO_RESULTS: ${{ runner.temp }}/scenario-results
      GODSPEED_SCENARIO_WORK: ${{ runner.temp }}/scenario-evidence
      GODSPEED_SCENARIO_AI_KEY: ${{ secrets.GODSPEED_SCENARIO_AI_KEY }}
      GODSPEED_SCENARIO_AI_URL: ${{ vars.GODSPEED_SCENARIO_AI_URL }}
      GODSPEED_SCENARIO_AI_MODEL: ${{ vars.GODSPEED_SCENARIO_AI_MODEL }}
      ELEVENLABS_TEST_KEY_STT: ${{ secrets.ELEVENLABS_TEST_KEY_STT }}
      ELEVENLABS_TEST_KEY_NO_STT: ${{ secrets.ELEVENLABS_TEST_KEY_NO_STT }}
      ELEVENLABS_TEST_VOICE_ID: ${{ vars.ELEVENLABS_TEST_VOICE_ID }}
      PRODUCT: ${{ needs.stage.outputs.product }}
      ENGINE: ${{ needs.stage.outputs.engine }}
      IMAGE: ${{ needs.stage.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: Install once and run the compatible checks
        shell: bash
        run: bash scenarios/run-installed-scenarios.sh "$STAGE_REF"
      - name: Keep each result and what each pooled scenario saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pooled-scenario-results
          path: |
            ${{ runner.temp }}/scenario-results
            ${{ runner.temp }}/scenario-evidence
          if-no-files-found: warn

  mac-install:
    name: a stranger's Mac install
    if: ${{ inputs.mac && startsWith(inputs.stage, 'candidate/') }}
    needs: stage
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PRODUCT: ${{ needs.stage.outputs.product }}
      ENGINE: ${{ needs.stage.outputs.engine }}
    steps:
      - name: The line, from the stage's own address
        run: curl -fsSL "$RAW/$STAGE_REF/install-godspeed.sh" | GODSPEED_STAGE_REF="$STAGE_REF" /bin/bash -x 2> >(tee "$RUNNER_TEMP/trace.log" >&2)
      - name: It installed what the stage names
        run: |
          fail() { echo "FAIL mac-install: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          root="$HOME/godspeed-v2"
          got=$(cat "$root/.godspeed/integrated-runtime/version" 2>/dev/null || echo none)
          [ "$got" = "$PRODUCT" ] || fail "runtime $got, the stage names $PRODUCT"
          { grep -qF "kit-bootstrap/$ENGINE/setup-godspeed.sh" "$RUNNER_TEMP/trace.log" && grep -qF "KB_BRANCH=$ENGINE" "$RUNNER_TEMP/trace.log"; } \
            || fail "the installer did not run kit-bootstrap $ENGINE, the stage's"
          grep -qF "GODSPEED_STARTER_REF=$PRODUCT" "$RUNNER_TEMP/trace.log" \
            || fail "the installer did not make the mission control from starter $PRODUCT, the stage's"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:47831/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:47831/health >/dev/null || fail "the notebook does not answer"
          echo "PASS mac-install: runtime and starter $got, kit-bootstrap $ENGINE, notebook answers" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/mac-install.txt"
      - name: Say so when it failed before its checks
        if: failure()
        run: 'if [ -s "$RUNNER_TEMP/failed" ]; then cat "$RUNNER_TEMP/failed" > "$RUNNER_TEMP/mac-install.txt"; else echo "FAIL mac-install: the install line itself failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/mac-install.txt"; fi'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-install-results
          path: ${{ runner.temp }}/mac-install.txt
          if-no-files-found: warn

  docker-server:
    name: a stranger's Docker server
    # The install, Docker and update proofs have no script of their own to change: a pull request never runs them.
    if: ${{ false }}
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ${{ needs.stage.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: Docker Hub images through Google's mirror (Docker Hub limits GitHub's shared runners; images stay pinned by digest)
        run: |
          f=/etc/docker/daemon.json; [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$f" | sudo tee "$f.new" >/dev/null && sudo mv "$f.new" "$f"
          sudo systemctl restart docker
      - name: The /server line, against the stage
        run: curl -fsSL https://godspeedmissioncontrol.com/server | sudo GODSPEED_STAGE_REF="$STAGE_REF" GODSPEED_STAGE_RAW="$RAW" GODSPEED_HOST=localhost bash
      - name: It runs the image the stage names, and is healthy
        run: |
          fail() { echo "FAIL docker-server: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          id=$(sudo docker ps -q --filter label=com.docker.compose.service=godspeed | head -1)
          [ -n "$id" ] || fail "no godspeed container is running"
          got=$(sudo docker inspect -f '{{.Config.Image}}' "$id")
          [ "$got" = "$IMAGE" ] || fail "runs $got, the stage names $IMAGE"
          for _ in $(seq 1 60); do [ "$(sudo docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] && break; sleep 5; done
          [ "$(sudo docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] || fail "the container is not healthy"
          echo "PASS docker-server: runs $got and is healthy" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Say so when it failed before its checks
        if: failure()
        run: '[ -s "$RUNNER_TEMP/failed" ] || echo "FAIL docker-server: a step before the checks failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY"'

  linux-update:
    name: an update from the current public version
    # The install, Docker and update proofs have no script of their own to change: a pull request never runs them.
    if: ${{ github.event_name != 'pull_request' }}
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCT: ${{ needs.stage.outputs.product }}
      ENGINE: ${{ needs.stage.outputs.engine }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: Today's public line
        run: curl -fsSL https://godspeedmissioncontrol.com/install | bash
      - name: Something of the owner's in the notebook and the settings
        run: |
          set -e
          root="$HOME/godspeed-v2"; rt="$root/.godspeed/integrated-runtime"
          node_bin=$(find "$rt/runtime" -maxdepth 3 -path '*/node-v*/bin/node' 2>/dev/null | sort | tail -n 1); node_bin=${node_bin:-node}
          notebook() { GODSPEED_WORKSPACE="$root" GODSPEED_MEDIA_ROOT="$rt/media" "$node_bin" "$rt/versions/$(cat "$rt/version")/notebook/bin/godspeed.mjs" "$@"; }
          echo '{"title":"Scenario five","content":"A note the owner wrote before the update"}' > "$RUNNER_TEMP/note.json"
          notebook record save notes "$RUNNER_TEMP/note.json"
          notebook export "$RUNNER_TEMP/before.json"
          mkdir -p "$root/work" && echo "the owner's own file" > "$root/work/scenario-5.txt"
          echo "GODSPEED_SCENARIO_FIVE=kept" >> "$HOME/.godspeed/device.env"
          cat "$rt/version" > "$RUNNER_TEMP/version-before"
      - name: The line again, against the stage
        run: curl -fsSL "$RAW/$STAGE_REF/install-godspeed.sh" | GODSPEED_STAGE_REF="$STAGE_REF" GODSPEED_STAGE_RAW="$RAW" bash -x 2> >(tee "$RUNNER_TEMP/trace.log" >&2)
      - name: It ends on the stage's version, everything kept
        run: |
          fail() { echo "FAIL linux-update: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          root="$HOME/godspeed-v2"; rt="$root/.godspeed/integrated-runtime"
          got=$(cat "$rt/version"); before=$(cat "$RUNNER_TEMP/version-before")
          [ "$got" = "$PRODUCT" ] || fail "runtime $got after the update, the stage names $PRODUCT"
          { grep -qF "kit-bootstrap/$ENGINE/setup-godspeed.sh" "$RUNNER_TEMP/trace.log" && grep -qF "KB_BRANCH=$ENGINE" "$RUNNER_TEMP/trace.log"; } \
            || fail "the installer did not run kit-bootstrap $ENGINE, the stage's"
          grep -qF "GODSPEED_STARTER_REF=$PRODUCT" "$RUNNER_TEMP/trace.log" \
            || fail "the installer did not make the mission control from starter $PRODUCT, the stage's"
          grep -qx "the owner's own file" "$root/work/scenario-5.txt" || fail "the owner's file is gone"
          grep -qx "GODSPEED_SCENARIO_FIVE=kept" "$HOME/.godspeed/device.env" || fail "the setting is gone"
          node_bin=$(find "$rt/runtime" -maxdepth 3 -path '*/node-v*/bin/node' 2>/dev/null | sort | tail -n 1); node_bin=${node_bin:-node}
          notebook() { GODSPEED_WORKSPACE="$root" GODSPEED_MEDIA_ROOT="$rt/media" "$node_bin" "$rt/versions/$got/notebook/bin/godspeed.mjs" "$@"; }
          notebook record list notes | grep -qF "A note the owner wrote before the update" || fail "the owner's note is gone from the notebook"
          notebook export "$RUNNER_TEMP/after.json" || fail "the notebook could not be exported after the update"
          lost=$("$node_bin" -e '
            const fs=require("fs");const rd=f=>JSON.parse(fs.readFileSync(f,"utf8"));
            const list=x=>Array.isArray(x)?x:(x.records||x.items||Object.values(x).find(Array.isArray)||[]);
            const key=r=>JSON.stringify([r.type||r.kind||"",r.id||r.slug||r.path||JSON.stringify(r)]);
            const after=new Set(list(rd(process.argv[2])).map(key));
            const lost=list(rd(process.argv[1])).filter(r=>!after.has(key(r)));
            if(lost.length){console.log(lost.length+" notebook records are gone");process.exit(1)}
          ' "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" 2>&1) || fail "${lost:-the two exports could not be compared}"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:47831/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:47831/health >/dev/null || fail "the notebook does not answer"
          echo "PASS linux-update: $before to $got, the note, every notebook record, the file and the setting kept" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/linux-update.txt"
      - name: Say so when it failed before its checks
        if: failure()
        run: 'if [ -s "$RUNNER_TEMP/failed" ]; then cat "$RUNNER_TEMP/failed" > "$RUNNER_TEMP/linux-update.txt"; else echo "FAIL linux-update: a step before the checks failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/linux-update.txt"; fi'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-update-result
          path: ${{ runner.temp }}/linux-update.txt
          if-no-files-found: error

  # The scenarios of 2.0.0-beta.8 are scripts in scenarios/ (their README says how each one
  # proves what it proves), run from the stage's own copy of them.
  settings-on-install:
    name: the faster-chat settings a fresh install carries
    needs: stage
    if: ${{ github.event_name == 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',settings-on-install,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: The scenario, the stage's own copy of it
        shell: bash
        run: bash scenarios/capture-scenario-result.sh settings-on-install "$STAGE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: settings-on-install-result, path: '${{ runner.temp }}/scenario-results/settings-on-install.txt', if-no-files-found: error }

  voice:
    name: a voice note, with the permission and without it
    needs: stage
    if: ${{ github.event_name == 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',voice,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELEVENLABS_TEST_KEY_STT: ${{ secrets.ELEVENLABS_TEST_KEY_STT }}
      ELEVENLABS_TEST_KEY_NO_STT: ${{ secrets.ELEVENLABS_TEST_KEY_NO_STT }}
      ELEVENLABS_TEST_VOICE_ID: ${{ vars.ELEVENLABS_TEST_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: The scenario, the stage's own copy of it
        shell: bash
        run: bash scenarios/capture-scenario-result.sh voice "$STAGE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voice-result, path: '${{ runner.temp }}/scenario-results/voice.txt', if-no-files-found: error }

  update-keeps-everything:
    name: an update from the current public version keeps everything
    needs: stage
    if: ${{ needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',update-keeps-everything,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # The owner's chat history is a conversation with the assistant, which needs an AI.
    env:
      GODSPEED_SCENARIO_AI_KEY: ${{ secrets.GODSPEED_SCENARIO_AI_KEY }}
      GODSPEED_SCENARIO_AI_URL: ${{ vars.GODSPEED_SCENARIO_AI_URL }}
      GODSPEED_SCENARIO_AI_MODEL: ${{ vars.GODSPEED_SCENARIO_AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: The scenario, the stage's own copy of it
        shell: bash
        run: bash scenarios/capture-scenario-result.sh update-keeps-everything "$STAGE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: update-keeps-everything-result, path: '${{ runner.temp }}/scenario-results/update-keeps-everything.txt', if-no-files-found: error }

  # The scenarios of 2.0.0-beta.12: reminders and their closings live in the notebook. None of them
  # needs a key: two computers are two installations on the one machine, joined through one bare
  # repository on it standing in for the private GitHub repository (scenarios/README.md).
  # reminder-closed-elsewhere, reminders-move-keeps-everything and late-reminder-file were taken out
  # on 31 October 2026, their scripts testing the wrong thing, and are back here fixed (#108).
  two-machines-move-at-once:
    name: two computers that move the same reminders at once
    needs: stage
    if: ${{ needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',two-machines-move-at-once,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: The scenario, the stage's own copy of it
        shell: bash
        run: bash scenarios/capture-scenario-result.sh two-machines-move-at-once "$STAGE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: two-machines-move-at-once-result, path: '${{ runner.temp }}/scenario-results/two-machines-move-at-once.txt', if-no-files-found: error }
  closed-offline-on-both:
    name: one reminder closed on two computers while they were apart
    needs: stage
    if: ${{ github.event_name == 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',closed-offline-on-both,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: The scenario, the stage's own copy of it
        shell: bash
        run: bash scenarios/capture-scenario-result.sh closed-offline-on-both "$STAGE_REF"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: closed-offline-on-both-result, path: '${{ runner.temp }}/scenario-results/closed-offline-on-both.txt', if-no-files-found: error }

  reminder-from-settings:
    name: a reminder saved in Settings on a fresh install
    needs: stage
