        if: always()
        with: { name: first-day-result, path: '${{ runner.temp }}/scenario-results/first-day.txt', if-no-files-found: error }

  verdict:
    name: the verdict
    if: always()
    needs: [stage, pooled, mac-install, docker-server, linux-update, settings-on-install, voice, update-keeps-everything, reminder-closed-elsewhere, reminders-move-keeps-everything, two-machines-move-at-once, late-reminder-file, closed-offline-on-both, reminder-from-settings, charm-challenge, no-video-skills-by-default, update-removes-only-unchanged-skills, briefing-breaks-a-rule, windows-old-names-move, telegram-language, brief-asked-in-chat, talk-prep-honest, no-question-he-cannot-judge, plain-yes, what-was-that, connection-check, workouts-from-hevy, day-becomes-facts, hermes-update-rollback, first-day]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      STAGE: ${{ needs.stage.result }}
      WANT_MAC: ${{ inputs.mac }}
      EVENT: ${{ github.event_name }}
      PICKED: ${{ needs.stage.outputs.picked }}
      IS_CANDIDATE: ${{ startsWith(inputs.stage, 'candidate/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22.19.0' }
      - uses: actions/download-artifact@v4
        if: ${{ needs.stage.result == 'success' }}
        with:
          path: ${{ runner.temp }}/scenario-results
          merge-multiple: true
      - name: Every selected scenario has a verdict, or the run fails
        shell: bash
        run: |
          # A pull request from a fork runs nothing (the stage job is skipped): nothing to judge.
          [ "$EVENT" != pull_request ] || [ "$STAGE" != skipped ] || { echo "No scenario runs on a pull request from a fork." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ "$STAGE" = success ] || { echo "FAIL stage: the stage file at $STAGE_REF could not be read or is not a stage file" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          args=(--catalog scenarios/scenario-catalog.tsv --results "$RUNNER_TEMP/scenario-results" --picked "$PICKED")
          [ "$IS_CANDIDATE" = true ] && args+=(--include-candidate-only)
          [ "$WANT_MAC" = true ] || args+=(--exclude mac-install)
          node scenarios/scenario-verdict.mjs "${args[@]}" | tee "$RUNNER_TEMP/scenario-verdicts.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tell the night in issues (one per failing scenario, closed when it passes)
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export RESULTS="$(node scenarios/scenario-verdict.mjs --catalog scenarios/scenario-catalog.tsv --results "$RUNNER_TEMP/scenario-results" --picked all --status)"
          export SCENARIO_VERDICTS="$(cat "$RUNNER_TEMP/scenario-verdicts.txt")"
          node scenarios/report-night.mjs
