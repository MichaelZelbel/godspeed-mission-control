  first-day:
    name: a fresh Docker server turns a first goal into useful work and a matching Telegram brief
    needs: stage
    if: ${{ github.event_name == 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',first-day,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GODSPEED_SCENARIO_AI_KEY: ${{ secrets.GODSPEED_SCENARIO_AI_KEY }}
      GODSPEED_SCENARIO_AI_URL: ${{ vars.GODSPEED_SCENARIO_AI_URL }}
      GODSPEED_SCENARIO_AI_MODEL: ${{ vars.GODSPEED_SCENARIO_AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
