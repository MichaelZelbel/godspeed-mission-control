# The Docker image: tested on every change that can touch it, published when it passes.
#
#   test     builds the image twice and walks the reader's path (docker/test.sh)
#   publish  main -> :latest and :sha-<commit>; a v* tag -> :<version>. Both
#            processor kinds (amd64, arm64), signed with a keyless signature, and
#            scanned for known vulnerabilities (reported, not blocking: most come
#            from the Hermes base image, which is updated by bumping its pin).
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docker/**", "server/**", "computer/**", ".github/workflows/docker.yml", ".dockerignore"]
  pull_request:
    paths: ["docker/**", "server/**", "computer/**", ".github/workflows/docker.yml", ".dockerignore"]
  workflow_dispatch:
    inputs:
      edition:
        description: Image to build and publish
        type: choice
        options: [full, telegram, hostinger, hostinger-automatic]
        default: full

permissions:
  contents: read

env:
  IMAGE: ghcr.io/michaelzelbel/godspeed-mission-control

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.edition == 'telegram'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Setup from Telegram, against a stand-in Telegram
        run: python3 docker/test/test-telegram-setup.py
      - name: The reader's path, twice
        run: bash docker/test.sh

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write   # the keyless signature
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.edition == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete application on the GitHub runner
        run: docker build --build-arg REVISION="$GITHUB_SHA" -f docker/full-candidate/Dockerfile -t godspeed-full-test .
      - name: Verify packaged server and fresh browser setup
        run: bash docker/full-candidate/test.sh godspeed-full-test
      # Never :latest. That tag is the stable channel: docker/compose.yaml on main pulls it, so a
      # preview pushed there reaches every stable reader on their next update (it did, until
      # 2026-10-06). Only the publish job above, on main, moves :latest.
      - name: Publish the exact tested image
        id: publish-full
        run: |
          for tag in full-alpha full-sha-${GITHUB_SHA}; do
            docker tag godspeed-full-test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker image inspect "$IMAGE:full-sha-${GITHUB_SHA}" --format '{{index .RepoDigests 0}}')
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          printf 'Published complete tested image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the tested complete image
        run: cosign sign --yes "${{ steps.publish-full.outputs.ref }}"
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-image-verification
          path: docker/full-candidate/evidence/
          retention-days: 14

  hostinger:
    if: github.event_name == 'workflow_dispatch' && (inputs.edition == 'hostinger' || inputs.edition == 'hostinger-automatic')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
      - name: Verify the public Hostinger deployment without using the existing VPS
        run: |
          if [ '${{ inputs.edition }}' = 'hostinger-automatic' ]; then
            bash docker/hostinger/test-automatic.sh
          else
            bash docker/hostinger/test.sh
          fi
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-install-verification
          path: docker/hostinger/evidence/
          retention-days: 14
