name: Publish approved notebook label fix
# One-off publication approved on 14 October 2026. The product source is fixed
# to the public release plus the notebook copy correction, never moving main.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_REVISION: 02f4ecbdd89276783004e102d032178f952f1c6e
jobs:
  native-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02f4ecbdd89276783004e102d032178f952f1c6e
          persist-credentials: false
      - name: Install, upgrade and recover
        run: bash notebook/test/native-install-linux.sh
  image:
    if: github.ref == 'refs/heads/main'
    needs: native-linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/michaelzelbel/godspeed-mission-control
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02f4ecbdd89276783004e102d032178f952f1c6e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Confirm the approved source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Original folder and integrated core checks
        run: node --test notebook/test/starter-workspace.test.mjs notebook/test/assistant-starter-wiring.test.mjs notebook/test/computer-wiring-on-existing-server.test.mjs notebook/test/windows-command-files.test.mjs notebook/test/final-core-contracts.test.mjs notebook/test/telegram-replies.test.mjs notebook/test/native-runtime.test.mjs
      - name: Installers and setup, without Docker
        run: |
          node --test notebook/test/native-installer.test.mjs notebook/test/native-start-script.test.mjs notebook/test/setup-code.test.mjs notebook/test/native-web-address.test.mjs notebook/test/server-address.test.mjs notebook/test/web-door.test.mjs
          bash docker/full-candidate/test-package-update.sh
          python3 docker/test/test-telegram-setup.py
      - name: Use the Docker Hub mirror
        run: |
          f=/etc/docker/daemon.json; [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$f" > /tmp/daemon.json && sudo mv /tmp/daemon.json "$f"
          sudo systemctl restart docker
      - name: Build the approved integrated version
        run: docker build --build-arg REVISION="$SOURCE_REVISION" -f docker/full-candidate/Dockerfile -t godspeed-v2-test .
      - name: Fresh installed server and browser check
        run: bash docker/full-candidate/test.sh godspeed-v2-test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        run: |
          docker tag godspeed-v2-test "$IMAGE:v2-sha-$SOURCE_REVISION"
          docker push "$IMAGE:v2-sha-$SOURCE_REVISION"
          digest=$(docker image inspect "$IMAGE:v2-sha-$SOURCE_REVISION" --format '{{index .RepoDigests 0}}')
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          printf 'Published tested image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign the published image
        run: cosign sign --yes "${{ steps.publish.outputs.ref }}"
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.publish.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-label-image-verification
          path: docker/full-candidate/evidence/
          retention-days: 14
