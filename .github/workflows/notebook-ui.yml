name: notebook-ui
on:
  pull_request:
    paths: ['notebook/ui/**', '.github/workflows/notebook-ui.yml']
  push:
    branches: [main]
    paths: ['notebook/ui/**', '.github/workflows/notebook-ui.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebook/ui
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: notebook/ui/package-lock.json
      - run: npm ci
      - name: unit tests
        run: npm test
      - name: type check
        run: npm run typecheck
