name: scenarios
# The run's name carries the stage it proved, so a run on a candidate's tag that was left at the
# default stage (beta) cannot be read as that candidate's pass: GitHub shows the input itself only
# in the run's logs.
run-name: ${{ github.event_name == 'pull_request' && format('scenarios on pull request {0}', github.event.pull_request.number) || (inputs.pr && format('scenarios on pull request {0}, started by hand', inputs.pr)) || format('scenarios {0}', inputs.stage || 'main, the night') }}
# The proving scenarios a candidate runs before the maintainer is asked for "go" (godspeed-dev,
# releases/godspeed-2.0.0-beta.7-stages/plan.md, "Proving scenarios" 1, 2 and 5, and
# releases/godspeed-2.0.0-beta.8-faster-chat/plan.md, "Proving scenarios" 1, 3 and 4, which are
# scripts in scenarios/; its scenario 2, the night chat tidy-up, left the release with the tidy-up
# on 27 October 2026). Started by hand on the candidate's own tag, with the same tag as the stage
# to prove: --ref candidate/2.0.0-beta.8 -f stage=candidate/2.0.0-beta.8 (or beta, or main).
# Each scenario runs on a fresh GitHub machine, installs the way a stranger does, and ends with one
# line in the run's summary: PASS <name>, or FAIL <name>: <what went wrong>. A scenario that cannot
# run fails: the verdict job at the end says so for every scenario that did not pass, and fails the
# run.
# Every night on main (process.md section 5): the Linux and Docker jobs. The Mac and Windows jobs
# are for a candidate (the Mac one only when `inputs.mac` is true, the Windows one only on a
# candidate's tag), which a scheduled run never is. The verdict job's last step then tells the night
# in issues (scenarios/report-night.mjs, releases/godspeed-2.0.0-beta.15-nightly-proof-six-repairs).
# A hand-started run may instead name a pull request (`pr`, with `only`, and `stage` left empty: -f pr=463 -f only=plain-yes):
# it builds that pull request's head image and proves the head on it, so a pull request that changes
# only the notebook (which no scenario script names, so a pull request run picks nothing) gets its
# scenarios run on its own code. A same-repository pull request only, and `only` is required, so one
# pull request never runs every scenario (the scenario AI key is capped).
# A pull request that changes a scenario's own script runs that scenario on the pull request's own
# code (the job `stage` reads the changed files and says which scenarios to run: `picked`), so a fix
# to a scenario is proved red or green before it merges instead of on the next night or candidate.
# Nothing else runs on a pull request: no Mac, no Windows, no scenario whose files the pull request
# did not touch (and never the install, Docker or update jobs), no issue in the night's name; a pull request from a fork runs nothing (no secrets).
# A newer commit on the same pull request cancels the older run.
# A candidate's run can be narrowed by hand: `-f only=first-day,talk-prep-honest` (job names, comma
# separated) runs only those jobs, plus the stage job and the verdict, which judges only what was
# picked and fails on a name that is no job; no issue is filed for it. Without `only` every job runs
# as before (the night, a plain dispatch). The Mac and Windows jobs run on `only` when listed. The
# run keeps the title "scenarios <stage>": the release gate counts a run by that title.
# A night proves main's own commit: with no `stage` input (the schedule) the stage is made from
# github.sha by scenarios/stage-for-run.sh and handed to every job as the artifact run-stage, read as
# file://; main's own stage.json names the last frozen version and is never read.
on:
  schedule:
    - cron: '30 2 * * *'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      stage:
        description: The stage to prove (a branch or tag holding stage.json, e.g. candidate/2.0.0-beta.7); empty proves this commit (or the pull request in `pr`) the way the night does
        required: false
        default: ''
      pr:
        description: 'A pull request number whose head image is built and whose head is proved (leave stage empty and name the jobs in only)'
        required: false
        default: ''
      mac:
        description: Also install on a Mac (once per candidate)
        type: boolean
        default: false
      only:
        description: 'Only these jobs (comma-separated job names, e.g. first-day,talk-prep-honest); empty runs every job'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  # One group per pull request, so a new commit cancels the older run; every other run has its own.
  group: scenarios-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Without a stage (the night) the stage is this commit's, in a folder every job downloads to
  # $RUNNER_TEMP/run-stage (GitHub's Ubuntu runners keep that at /home/runner/work/_temp).
  STAGE_REF: ${{ inputs.stage || 'this-commit' }}
  RAW: ${{ inputs.stage && 'https://raw.githubusercontent.com/MichaelZelbel/godspeed-mission-control' || 'file:///home/runner/work/_temp/run-stage' }}
  GODSPEED_SCENARIO_RAW: ${{ inputs.stage && 'https://raw.githubusercontent.com/MichaelZelbel/godspeed-mission-control' || 'file:///home/runner/work/_temp/run-stage' }}
jobs:
  pr-image:
    name: the selected pull request server image
    # It runs (and does nothing) on every event but a fork's pull request, so that it is never
    # skipped there: GitHub skips a job whose dependencies, however indirect, include a skipped
    # job, and every scenario needs stage, which needs this. When it was skipped outside pull
    # requests (9 November 2026), every night and candidate run skipped every scenario.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      picked: ${{ steps.pick.outputs.picked }}
      image: ${{ steps.publish.outputs.image }}
      sha: ${{ steps.named.outputs.sha }}
    env:
      IMAGE: ghcr.io/michaelzelbel/godspeed-mission-control
    steps:
      - name: The pull request a hand-started run names
        id: named
        if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAMED_PR: ${{ inputs.pr }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          set -e
          [[ "$NAMED_PR" =~ ^[0-9]+$ ]] || { echo "FAIL pr: the pull request must be a number, not: $NAMED_PR" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -z "$INPUT_STAGE" ] || { echo "FAIL pr: a run on a pull request proves its head, so stage must be empty (leave it empty), not $INPUT_STAGE" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "$(printf '%s' "$INPUT_ONLY" | tr -d ' ,')" ] || { echo "FAIL pr: name the jobs to run in only, so one pull request does not run every scenario" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NAMED_PR" --jq '[(if .merged then "merged" else .state end), .head.repo.full_name, .head.sha] | @tsv' > "$RUNNER_TEMP/named"
          IFS=$'	' read -r state repo sha < "$RUNNER_TEMP/named"
          [ "$state" = open ] || [ "$state" = merged ] || { echo "FAIL pr: pull request $NAMED_PR is $state, not open or merged" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "FAIL pr: pull request $NAMED_PR comes from $repo; only a branch of this repository is built here" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "FAIL pr: pull request $NAMED_PR has no head commit"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Proving the head of pull request $NAMED_PR, ${sha:0:7}, on an image built from it." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || steps.named.outputs.sha != ''
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.named.outputs.sha }}
          persist-credentials: false
      - name: Is a server scenario selected?
        id: pick
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed"
          jobs=$(grep -oE 'bash scenarios/[a-z0-9-]+\.sh "\$STAGE_REF"' .github/workflows/scenarios.yml | sed -E 's|bash scenarios/||; s|\.sh .*||' | sort -u)
          for job in $jobs; do
            grep -qE "^scenarios/$job(\\.sh|-[^/]*)$" "$RUNNER_TEMP/changed" && grep -qF server_install "scenarios/$job.sh" && { echo 'picked=true' >> "$GITHUB_OUTPUT"; exit 0; }
            grep -qx 'scenarios/server-lib.sh' "$RUNNER_TEMP/changed" && grep -qF '. "$HERE/server-lib.sh"' "scenarios/$job.sh" && { echo 'picked=true' >> "$GITHUB_OUTPUT"; exit 0; }
          done
          echo 'picked=false' >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: steps.pick.outputs.picked == 'true' || steps.named.outputs.sha != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the selected PR-head image
        id: publish
        if: steps.pick.outputs.picked == 'true' || steps.named.outputs.sha != ''
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.named.outputs.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          TAG="pr-$PR_NUMBER-$HEAD_SHA"
          docker build --build-arg REVISION="$HEAD_SHA" -f docker/full-candidate/Dockerfile -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the PR-head image has no immutable digest: $digest"; exit 1; }
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  stage:
    name: the stage file
    needs: pr-image
    # A pull request from a fork has no secrets, so no scenario can run on it: nothing runs.
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && needs.pr-image.result == 'success')) && (inputs.pr == '' || needs.pr-image.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      # The commit the run proves: a pull request's own head, otherwise the one the run started on.
      PROOF_SHA: ${{ github.event.pull_request.head.sha || needs.pr-image.outputs.sha || github.sha }}
      GODSPEED_SCENARIO_PR_IMAGE: ${{ needs.pr-image.outputs.image }}
      # A pull request run that built no image runs no server scenario, so the ancestor-image guard does not apply to it.
      GODSPEED_SCENARIO_ANCESTOR_OK: ${{ github.event_name == 'pull_request' && '1' || '' }}
    outputs:
      picked: ${{ steps.reuse.outputs.picked }}
      proof: ${{ env.PROOF_SHA }}
      version: ${{ steps.read.outputs.version }}
      product: ${{ steps.read.outputs.product }}
      engine: ${{ steps.read.outputs.engine }}
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.stage || github.event.pull_request.head.sha || needs.pr-image.outputs.sha || github.sha }}
          fetch-depth: ${{ inputs.stage && 1 || 50 }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22.19.0' }
      - name: This commit's own stage (no stage given, the night)
        if: ${{ !inputs.stage }}
        run: |
          set -e
          out=$(bash scenarios/stage-for-run.sh '' "$PROOF_SHA" "$RUNNER_TEMP/run-stage")
          echo "$out"
          [ "$out" = "$(printf 'ref=%s\nraw=%s' "$STAGE_REF" "$RAW")" ] || { echo "the stage is not where the jobs will read it ($RAW)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
          include-hidden-files: true
          retention-days: 3
      - name: Which scenarios this run proves
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ONLY: ${{ inputs.only }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            # A hand-started run may name the jobs to run; an empty value and every other event run them all.
            only=$(printf '%s' "${ONLY:-}" | tr -d ' \t\r\n')
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -z "$only" ]; then
              echo "picked=all" | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$only" =~ ^[a-z0-9,-]*[a-z0-9-][a-z0-9,-]*$ ]] || { echo "only must be job names separated by commas, not: $only" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
            picked=$(printf ',%s,' "$only" | tr -s ',')
            echo "Only these jobs run:$picked" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "picked=$picked" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request: the scenarios whose own files it changed, a job being named like its
          # script (scenarios/<job>.sh) and owning scenarios/<job>.sh and scenarios/<job>-*.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed"
          jobs=$(grep -oE 'bash scenarios/[a-z0-9-]+\.sh "\$STAGE_REF"' .github/workflows/scenarios.yml | sed -E 's|bash scenarios/||; s|\.sh .*||' | sort -u)
          picked=','
          for j in $jobs; do
            if grep -qE "^scenarios/$j(\.sh|-[^/]*)$" "$RUNNER_TEMP/changed" \
              || { grep -qx 'scenarios/server-lib.sh' "$RUNNER_TEMP/changed" && grep -qF '. "$HERE/server-lib.sh"' "scenarios/$j.sh"; }; then picked="$picked$j,"; fi
          done
          echo "The pull request changes $(wc -l < "$RUNNER_TEMP/changed") files; scenarios picked:$picked" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "picked=$picked" | tee -a "$GITHUB_OUTPUT"
      - name: Leave out what already passed on this pull request
        id: reuse
        # An AI scenario that passed on an earlier head of this same pull request is not run (and paid
        # for) again when the pull request's own change to the files that picked it is unchanged, as
        # after a push that only merged main in. Pull requests only; every other event keeps `picked`
        # as it is. Any doubt (no earlier pass, a different own change, an error) keeps the scenario in.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PICKED: ${{ steps.pick.outputs.picked }}
          CHANGED_FILE: ${{ runner.temp }}/changed
        run: node scenarios/reuse-earlier-pass.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Read and check it
        id: read
        run: |
          set -e
          f=stage.json; [ -n "$INPUT_STAGE" ] || f="$RUNNER_TEMP/run-stage/this-commit/stage.json"
          node stage/stage.mjs "$f" check
          {
            echo "version=$(node stage/stage.mjs "$f" get version)"
            echo "product=$(node stage/stage.mjs "$f" get productCommit)"
            echo "engine=$(node stage/stage.mjs "$f" get kitBootstrap.unixEngineCommit)"
            echo "image=$(node stage/stage.mjs "$f" get serverEditions.server.image)"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          INPUT_STAGE: ${{ inputs.stage }}

  linux-install:
    name: a stranger's Linux install
    # The install, Docker and update proofs have no script of their own to change: a pull request never runs them.
    if: ${{ github.event_name != 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',linux-install,')) }}
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCT: ${{ needs.stage.outputs.product }}
      ENGINE: ${{ needs.stage.outputs.engine }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: The line, from the stage's own address
        run: curl -fsSL "$RAW/$STAGE_REF/install-godspeed.sh" | GODSPEED_STAGE_REF="$STAGE_REF" GODSPEED_STAGE_RAW="$RAW" bash -x 2> >(tee "$RUNNER_TEMP/trace.log" >&2)
      - name: It installed what the stage names
        run: |
          fail() { echo "FAIL linux-install: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          root="$HOME/godspeed-v2"
          got=$(cat "$root/.godspeed/integrated-runtime/version" 2>/dev/null || echo none)
          [ "$got" = "$PRODUCT" ] || fail "runtime $got, the stage names $PRODUCT"
          { grep -qF "kit-bootstrap/$ENGINE/setup-godspeed.sh" "$RUNNER_TEMP/trace.log" && grep -qF "KB_BRANCH=$ENGINE" "$RUNNER_TEMP/trace.log"; } \
            || fail "the installer did not run kit-bootstrap $ENGINE, the stage's"
          grep -qF "GODSPEED_STARTER_REF=$PRODUCT" "$RUNNER_TEMP/trace.log" \
            || fail "the installer did not make the mission control from starter $PRODUCT, the stage's"
          curl -fsSL "$RAW/$STAGE_REF/stage.json" -o expected.json || fail "the stage file could not be read again"
          cmp -s expected.json "$root/.godspeed/stage.json" || fail "the kept stage file is not the stage's"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:47831/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:47831/health >/dev/null || fail "the notebook does not answer"
          echo "PASS linux-install: runtime and starter $got, kit-bootstrap $ENGINE, stage $STAGE_REF, notebook answers" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Say so when it failed before its checks
        if: failure()
        run: '[ -s "$RUNNER_TEMP/failed" ] || echo "FAIL linux-install: the install line itself failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY"'

  mac-install:
    name: a stranger's Mac install
    if: ${{ needs.stage.outputs.picked == 'all' && inputs.mac || contains(needs.stage.outputs.picked, ',mac-install,') }}
    needs: stage
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PRODUCT: ${{ needs.stage.outputs.product }}
      ENGINE: ${{ needs.stage.outputs.engine }}
    steps:
      - name: The line, from the stage's own address
        run: curl -fsSL "$RAW/$STAGE_REF/install-godspeed.sh" | GODSPEED_STAGE_REF="$STAGE_REF" /bin/bash -x 2> >(tee "$RUNNER_TEMP/trace.log" >&2)
      - name: It installed what the stage names
        run: |
          fail() { echo "FAIL mac-install: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          root="$HOME/godspeed-v2"
          got=$(cat "$root/.godspeed/integrated-runtime/version" 2>/dev/null || echo none)
          [ "$got" = "$PRODUCT" ] || fail "runtime $got, the stage names $PRODUCT"
          { grep -qF "kit-bootstrap/$ENGINE/setup-godspeed.sh" "$RUNNER_TEMP/trace.log" && grep -qF "KB_BRANCH=$ENGINE" "$RUNNER_TEMP/trace.log"; } \
            || fail "the installer did not run kit-bootstrap $ENGINE, the stage's"
          grep -qF "GODSPEED_STARTER_REF=$PRODUCT" "$RUNNER_TEMP/trace.log" \
            || fail "the installer did not make the mission control from starter $PRODUCT, the stage's"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:47831/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:47831/health >/dev/null || fail "the notebook does not answer"
          echo "PASS mac-install: runtime and starter $got, kit-bootstrap $ENGINE, notebook answers" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Say so when it failed before its checks
        if: failure()
        run: '[ -s "$RUNNER_TEMP/failed" ] || echo "FAIL mac-install: the install line itself failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY"'

  docker-server:
    name: a stranger's Docker server
    # The install, Docker and update proofs have no script of their own to change: a pull request never runs them.
    if: ${{ github.event_name != 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',docker-server,')) }}
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ${{ needs.stage.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: Docker Hub images through Google's mirror (Docker Hub limits GitHub's shared runners; images stay pinned by digest)
        run: |
          f=/etc/docker/daemon.json; [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' "$f" | sudo tee "$f.new" >/dev/null && sudo mv "$f.new" "$f"
          sudo systemctl restart docker
      - name: The /server line, against the stage
        run: curl -fsSL https://godspeedmissioncontrol.com/server | sudo GODSPEED_STAGE_REF="$STAGE_REF" GODSPEED_STAGE_RAW="$RAW" GODSPEED_HOST=localhost bash
      - name: It runs the image the stage names, and is healthy
        run: |
          fail() { echo "FAIL docker-server: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          id=$(sudo docker ps -q --filter label=com.docker.compose.service=godspeed | head -1)
          [ -n "$id" ] || fail "no godspeed container is running"
          got=$(sudo docker inspect -f '{{.Config.Image}}' "$id")
          [ "$got" = "$IMAGE" ] || fail "runs $got, the stage names $IMAGE"
          for _ in $(seq 1 60); do [ "$(sudo docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] && break; sleep 5; done
          [ "$(sudo docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] || fail "the container is not healthy"
          echo "PASS docker-server: runs $got and is healthy" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Say so when it failed before its checks
        if: failure()
        run: '[ -s "$RUNNER_TEMP/failed" ] || echo "FAIL docker-server: a step before the checks failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY"'

  linux-update:
    name: an update from the current public version
    # The install, Docker and update proofs have no script of their own to change: a pull request never runs them.
    if: ${{ github.event_name != 'pull_request' && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',linux-update,')) }}
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRODUCT: ${{ needs.stage.outputs.product }}
      ENGINE: ${{ needs.stage.outputs.engine }}
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.stage }}
        with:
          name: run-stage
          path: ${{ runner.temp }}/run-stage
      - name: Today's public line
        run: curl -fsSL https://godspeedmissioncontrol.com/install | bash
      - name: Something of the owner's in the notebook and the settings
        run: |
          set -e
          root="$HOME/godspeed-v2"; rt="$root/.godspeed/integrated-runtime"
          node_bin=$(find "$rt/runtime" -maxdepth 3 -path '*/node-v*/bin/node' 2>/dev/null | sort | tail -n 1); node_bin=${node_bin:-node}
          notebook() { GODSPEED_WORKSPACE="$root" GODSPEED_MEDIA_ROOT="$rt/media" "$node_bin" "$rt/versions/$(cat "$rt/version")/notebook/bin/godspeed.mjs" "$@"; }
          echo '{"title":"Scenario five","content":"A note the owner wrote before the update"}' > "$RUNNER_TEMP/note.json"
          notebook record save notes "$RUNNER_TEMP/note.json"
          notebook export "$RUNNER_TEMP/before.json"
          mkdir -p "$root/work" && echo "the owner's own file" > "$root/work/scenario-5.txt"
          echo "GODSPEED_SCENARIO_FIVE=kept" >> "$HOME/.godspeed/device.env"
          cat "$rt/version" > "$RUNNER_TEMP/version-before"
      - name: The line again, against the stage
        run: curl -fsSL "$RAW/$STAGE_REF/install-godspeed.sh" | GODSPEED_STAGE_REF="$STAGE_REF" GODSPEED_STAGE_RAW="$RAW" bash -x 2> >(tee "$RUNNER_TEMP/trace.log" >&2)
      - name: It ends on the stage's version, everything kept
        run: |
          fail() { echo "FAIL linux-update: $1" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/failed"; exit 1; }
          root="$HOME/godspeed-v2"; rt="$root/.godspeed/integrated-runtime"
          got=$(cat "$rt/version"); before=$(cat "$RUNNER_TEMP/version-before")
          [ "$got" = "$PRODUCT" ] || fail "runtime $got after the update, the stage names $PRODUCT"
          { grep -qF "kit-bootstrap/$ENGINE/setup-godspeed.sh" "$RUNNER_TEMP/trace.log" && grep -qF "KB_BRANCH=$ENGINE" "$RUNNER_TEMP/trace.log"; } \
            || fail "the installer did not run kit-bootstrap $ENGINE, the stage's"
          grep -qF "GODSPEED_STARTER_REF=$PRODUCT" "$RUNNER_TEMP/trace.log" \
            || fail "the installer did not make the mission control from starter $PRODUCT, the stage's"
          grep -qx "the owner's own file" "$root/work/scenario-5.txt" || fail "the owner's file is gone"
          grep -qx "GODSPEED_SCENARIO_FIVE=kept" "$HOME/.godspeed/device.env" || fail "the setting is gone"
          node_bin=$(find "$rt/runtime" -maxdepth 3 -path '*/node-v*/bin/node' 2>/dev/null | sort | tail -n 1); node_bin=${node_bin:-node}
          notebook() { GODSPEED_WORKSPACE="$root" GODSPEED_MEDIA_ROOT="$rt/media" "$node_bin" "$rt/versions/$got/notebook/bin/godspeed.mjs" "$@"; }
          notebook record list notes | grep -qF "A note the owner wrote before the update" || fail "the owner's note is gone from the notebook"
          notebook export "$RUNNER_TEMP/after.json" || fail "the notebook could not be exported after the update"
          lost=$("$node_bin" -e '
            const fs=require("fs");const rd=f=>JSON.parse(fs.readFileSync(f,"utf8"));
            const list=x=>Array.isArray(x)?x:(x.records||x.items||Object.values(x).find(Array.isArray)||[]);
            const key=r=>JSON.stringify([r.type||r.kind||"",r.id||r.slug||r.path||JSON.stringify(r)]);
            const after=new Set(list(rd(process.argv[2])).map(key));
            const lost=list(rd(process.argv[1])).filter(r=>!after.has(key(r)));
            if(lost.length){console.log(lost.length+" notebook records are gone");process.exit(1)}
          ' "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" 2>&1) || fail "${lost:-the two exports could not be compared}"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:47831/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:47831/health >/dev/null || fail "the notebook does not answer"
          echo "PASS linux-update: $before to $got, the note, every notebook record, the file and the setting kept" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Say so when it failed before its checks
        if: failure()
        run: '[ -s "$RUNNER_TEMP/failed" ] || echo "FAIL linux-update: a step before the checks failed (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY"'

