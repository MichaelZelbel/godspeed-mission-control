  # An install from before 2.0.0-beta.11 moves to the folder names without "Full Alpha" (#6, #150).
  # For a candidate only: a Windows machine costs the most, and the night proves main.
  windows-old-names-move:
    name: an old Windows install moves to the new folder names
    if: ${{ startsWith(inputs.stage, 'candidate/') && (needs.stage.outputs.picked == 'all' || contains(needs.stage.outputs.picked, ',windows-old-names-move,')) }}
    needs: stage
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { mode: [moves, held] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.stage }}', persist-credentials: false }
      - name: The scenario, the stage's own copy of it
        shell: pwsh
        run: |
          $a = @('${{ inputs.stage }}'); if ('${{ matrix.mode }}' -eq 'held') { $a += 'held' }
          # Its output goes to files, not to this step's pipe: a program the install leaves running
          # would otherwise hold that pipe open, and the step never ended (2 November 2026, held).
          $p = Start-Process pwsh -ArgumentList (@('-NoProfile', '-File', 'scenarios/windows-old-names-move.ps1') + $a) -NoNewWindow -PassThru `
            -RedirectStandardOutput "$env:RUNNER_TEMP/verdict" -RedirectStandardError "$env:RUNNER_TEMP/scenario-steps.log"
          $p.WaitForExit()
          Get-Content "$env:RUNNER_TEMP/scenario-steps.log", "$env:RUNNER_TEMP/verdict" -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-old-names-move-${{ matrix.mode }}
          path: ${{ runner.temp }}/windows-old-names-move
      - name: Say so when it stopped before its own verdict
        if: failure()
        shell: bash
        run: 'grep -qE "^(PASS|FAIL) windows-old-names-move:" "$RUNNER_TEMP/verdict" 2>/dev/null || echo "FAIL windows-old-names-move: it stopped before its own verdict (its step log says how)" | tee -a "$GITHUB_STEP_SUMMARY"'

