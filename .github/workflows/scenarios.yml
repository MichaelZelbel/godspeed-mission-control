  verdict:
    name: the verdict
    if: always()
    needs: [stage, pr-image, linux-install, mac-install, docker-server, linux-update, settings-on-install, voice, update-keeps-everything, reminder-closed-elsewhere, reminders-move-keeps-everything, two-machines-move-at-once, late-reminder-file, closed-offline-on-both, reminder-from-settings, charm-challenge, no-video-skills-by-default, update-removes-only-unchanged-skills, briefing-breaks-a-rule, windows-old-names-move, telegram-language, brief-asked-in-chat, talk-prep-honest, no-question-he-cannot-judge, plain-yes, what-was-that, connection-check, workouts-from-hevy, day-becomes-facts, hermes-update-rollback, first-day, server-update-keeps-everything]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      CANDIDATE_ONLY: mac-install windows-old-names-move
      STAGE: ${{ needs.stage.result }}
      PR_IMAGE: ${{ needs.pr-image.result }}
      WANT_MAC: ${{ inputs.mac }}
      EVENT: ${{ github.event_name }}
      PICKED: ${{ needs.stage.outputs.picked }}
      IS_CANDIDATE: ${{ startsWith(inputs.stage, 'candidate/') }}
      RESULTS: >-
        linux-install=${{ needs.linux-install.result }}
        mac-install=${{ needs.mac-install.result }}
        docker-server=${{ needs.docker-server.result }}
        linux-update=${{ needs.linux-update.result }}
        settings-on-install=${{ needs.settings-on-install.result }}
        voice=${{ needs.voice.result }}
        update-keeps-everything=${{ needs.update-keeps-everything.result }}
        reminder-closed-elsewhere=${{ needs.reminder-closed-elsewhere.result }}
        reminders-move-keeps-everything=${{ needs.reminders-move-keeps-everything.result }}
        two-machines-move-at-once=${{ needs.two-machines-move-at-once.result }}
        late-reminder-file=${{ needs.late-reminder-file.result }}
        closed-offline-on-both=${{ needs.closed-offline-on-both.result }}
        reminder-from-settings=${{ needs.reminder-from-settings.result }}
        charm-challenge=${{ needs.charm-challenge.result }}
        no-video-skills-by-default=${{ needs.no-video-skills-by-default.result }}
        update-removes-only-unchanged-skills=${{ needs.update-removes-only-unchanged-skills.result }}
        briefing-breaks-a-rule=${{ needs.briefing-breaks-a-rule.result }}
        windows-old-names-move=${{ needs.windows-old-names-move.result }}
        telegram-language=${{ needs.telegram-language.result }}
        brief-asked-in-chat=${{ needs.brief-asked-in-chat.result }}
        talk-prep-honest=${{ needs.talk-prep-honest.result }}
        no-question-he-cannot-judge=${{ needs.no-question-he-cannot-judge.result }}
        plain-yes=${{ needs.plain-yes.result }}
        what-was-that=${{ needs.what-was-that.result }}
        connection-check=${{ needs.connection-check.result }}
        workouts-from-hevy=${{ needs.workouts-from-hevy.result }}
        day-becomes-facts=${{ needs.day-becomes-facts.result }}
        hermes-update-rollback=${{ needs.hermes-update-rollback.result }}
        first-day=${{ needs.first-day.result }}
        server-update-keeps-everything=${{ needs.server-update-keeps-everything.result }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'schedule'
        with: { node-version: '22.19.0' }
      - name: Every scenario passed, or the run fails
        run: |
          bad=0
          # A pull request whose image job failed or was cancelled skipped the stage: that is a failure, never a fork.
          case $PR_IMAGE in failure|cancelled) echo "FAIL pr-image: the pull request's server image job ended $PR_IMAGE, so no scenario ran" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1 ;; esac
          # A pull request from a fork runs nothing (the stage job is skipped): nothing to judge.
          [ "$EVENT" != pull_request ] || [ "$STAGE" != skipped ] || { echo "No scenario runs on a pull request from a fork." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          [ "$STAGE" = success ] || { echo "FAIL stage: the stage file at $STAGE_REF could not be read or is not a stage file" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1; }
          # A name in `only` that is no job would run nothing and pass: it fails.
          if [ "$EVENT" = workflow_dispatch ] && [ "$PICKED" != all ] && [ "$STAGE" = success ]; then
            for want in ${PICKED//,/ }; do
              [ "$want" = stage ] || [ "$want" = verdict ] || case " $RESULTS " in *" $want="*) ;; *) echo "FAIL $want: there is no job of this name to run" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1 ;; esac
            done
          fi
          for pair in $RESULTS; do
            name=${pair%%=*}; result=${pair#*=}
            [ "$name" != mac-install ] || [ "$WANT_MAC" = true ] || [[ "$PICKED" == *",mac-install,"* ]] || continue
            [ "$name" != windows-old-names-move ] || [ "$IS_CANDIDATE" = true ] || [[ "$PICKED" == *",windows-old-names-move,"* ]] || continue
            case $result in
              success) ;;
              failure) bad=1 ;; # its own FAIL line is in the summary already
              skipped)
                # On a pull request only the scenarios it changed run, on a hand-started run only the ones
                # named in `only`; the others are not judged.
                if [ "$PICKED" != all ] && [ "$STAGE" = success ] && [[ "$PICKED" != *",$name,"* ]]; then continue; fi
                echo "FAIL $name: it did not run, because the stage file could not be read" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1 ;;
              *) echo "FAIL $name: it ended $result" | tee -a "$GITHUB_STEP_SUMMARY"; bad=1 ;;
            esac
          done
          exit $bad
      - name: Tell the night in issues (one per failing scenario, closed when it passes)
        if: always() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scenarios/report-night.mjs
