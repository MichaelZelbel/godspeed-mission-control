name: tools-test
# No pull_request trigger since 25 October 2026: the `required` check (required.yml) runs this
# same list on every pull request, so requiring it here as well would only duplicate the work.
# The push to main keeps running it.
on:
  push:
    branches: [main]
    paths: ['tools/**', 'starter-godspeed/**', 'package.json', 'computer/package.json', '.github/workflows/tools-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: tool tests
        run: |
          set -e
          for t in tools/test-due.sh tools/test-install-count.sh tools/test-uninstall.sh tools/test-goals.sh tools/test-check-moves.sh tools/test-work.sh tools/test-work-run.sh tools/test-forecast.sh tools/test-check-written.sh tools/test-world-pull.sh tools/test-mc-run.sh tools/test-decide.sh tools/test-check-research.sh tools/test-research.sh tools/test-launchers.sh tools/test-prompt-archive.sh; do
            echo "== $t"; bash "$t"
          done
          for t in tools/test-observed-state.js tools/test-check-brief.js tools/test-limit.js tools/test-apply-target.js tools/test-nested-checkout.js tools/test-no-chapters.js; do
            echo "== $t"; node "$t"
          done
      # The reminder tool the way a reader receives it: copied away from the kit, with no notebook
      # beside it (the Docker image, a Hostinger server). 2.0.0-beta.12 left that edition with no
      # reminders at all, and only docker.yml, which does not run on tools/, could have seen it (#112).
      - name: Reminders on an install with no notebook
        run: bash tools/test-due-without-notebook.sh
      # The notebook needs Node 22.19: started from a checkout inside a "type": "module" folder.
      - uses: actions/setup-node@v4
        with: { node-version: '22.19.0' }
      - name: the product checked out inside an add-on's folder, the notebook too
        run: node tools/test-nested-checkout.js
