name: tools-test
on:
  push:
    branches: [main]
    paths: ['tools/**', 'starter-godspeed/**', '.github/workflows/tools-test.yml']
  pull_request:
    paths: ['tools/**', 'starter-godspeed/**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: tool tests
        run: |
          set -e
          for t in tools/test-install-count.sh tools/test-goals.sh tools/test-check-moves.sh tools/test-work.sh tools/test-work-run.sh tools/test-forecast.sh tools/test-check-written.sh tools/test-world-pull.sh tools/test-mc-run.sh tools/test-launchers.sh; do
            echo "== $t"; bash "$t"
          done
          for t in tools/test-observed-state.js tools/test-check-brief.js; do
            echo "== $t"; node "$t"
          done
