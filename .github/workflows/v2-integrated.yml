name: Integrated Godspeed v2
on:
  push:
    branches: [codex/godspeed-v2-completeness]
    paths: [.github/workflows/v2-integrated.yml, 'notebook/ui/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Original folder and integrated core checks
        run: node --test notebook/test/starter-workspace.test.mjs notebook/test/assistant-starter-wiring.test.mjs notebook/test/final-core-contracts.test.mjs
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the integrated version
        run: docker build --build-arg REVISION="$GITHUB_SHA" -f docker/full-candidate/Dockerfile -t godspeed-v2-test .
      - name: Fresh installed server and browser check
        run: bash docker/full-candidate/test.sh godspeed-v2-test
      - name: Publish separate version 2 image
        run: |
          image=ghcr.io/michaelzelbel/godspeed-mission-control
          docker tag godspeed-v2-test "$image:v2-sha-$GITHUB_SHA"
          docker push "$image:v2-sha-$GITHUB_SHA"
          docker image inspect "$image:v2-sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
