# Godspeed Mission Control on your own server, confined to one container.
#
#   docker compose up -d                                  start it
#   docker compose exec godspeed godspeed-setup           set it up (again at any time)
#   docker compose pull && docker compose up -d           update it
#
# Everything you own lives in the volume `godspeed-data`: your folder, Hermes' settings,
# the sign-ins. Back it up by copying that one volume. docker/README.md has the rest.

services:
  godspeed:
    image: ghcr.io/michaelzelbel/godspeed-mission-control:${GODSPEED_VERSION:-latest}
    container_name: godspeed
    restart: unless-stopped
    command: gateway run
    volumes:
      - godspeed-data:/opt/data

    # No ports. Telegram is reached by asking Telegram for new messages, an outgoing
    # connection, so nothing on the internet ever connects in.

    environment:
      TZ: ${TZ:-Europe/Berlin}
      # The patrol that stops runaway commands inside the container. on | off
      GODSPEED_PATROL: ${GODSPEED_PATROL:-on}

    # THE WALLS. Whatever the assistant starts, the container as a whole never gets more
    # than this. One core by default, which leaves the rest of the server to everything
    # else on it; raise GODSPEED_CPUS on a bigger machine.
    cpus: ${GODSPEED_CPUS:-1}
    mem_limit: ${GODSPEED_MEMORY:-2g}
    pids_limit: 1024
    shm_size: 1g          # the browser Hermes drives needs it

    # Only what the image's start-up needs: fixing ownership of the volume and dropping
    # from root to the assistant's own account. No new privileges after that.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  godspeed-data:
