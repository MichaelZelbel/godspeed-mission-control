name: godspeed-full-candidate
services:
  notebook:
    image: ${GODSPEED_CANDIDATE_IMAGE:?Use the immutable candidate image from the package manifest}
    restart: unless-stopped
    # A small init as process 1 collects the programs the assistant leaves behind. The image's
    # own entrypoint replaces the one that did, and until 7 October 2026 they piled up as zombies.
    init: true
    environment:
      GODSPEED_ACCESS_TOKEN: ${GODSPEED_SETUP_CODE:-${GODSPEED_CANDIDATE_TOKEN:?Choose a private setup code before deploying}}
      GODSPEED_DEVICE: vps
      GODSPEED_COMPUTER: ${GODSPEED_CANDIDATE_COMPUTER:-off}
      GODSPEED_COMPUTER_DIR: /opt/data/full-candidate/computer
      GODSPEED_COMPUTER_DOOR_PORT: "7445"
      GODSPEED_COMPUTER_CDP_PORT: "9225"
      GODSPEED_COMPUTER_PORT: ${GODSPEED_CANDIDATE_COMPUTER_PORT:-47445}
      GODSPEED_PUBLIC_HOST: ${GODSPEED_CANDIDATE_COMPUTER_HOST:-localhost}
      GODSPEED_TELEGRAM: ${GODSPEED_CANDIDATE_TELEGRAM:-web}
      GODSPEED_CANDIDATE_BOT_TOKEN: ${GODSPEED_CANDIDATE_BOT_TOKEN:-}
      GODSPEED_CANDIDATE_BOT_OWNER: ${GODSPEED_CANDIDATE_BOT_OWNER:-}
    volumes:
      - candidate-data:/opt/data/full-candidate
    ports:
      - "127.0.0.1:${GODSPEED_CANDIDATE_LOCAL_PORT:-47832}:47831"
      - "${GODSPEED_CANDIDATE_COMPUTER_BIND:-127.0.0.1}:${GODSPEED_CANDIDATE_COMPUTER_PORT:-47445}:7445"
    networks: [candidate]
  https:
    image: ${GODSPEED_CADDY_IMAGE:?Use the pinned Caddy image from the candidate manifest}
    restart: unless-stopped
    environment:
      GODSPEED_CANDIDATE_HOST: ${GODSPEED_CANDIDATE_HOST:-localhost}
    ports:
      - "${GODSPEED_CANDIDATE_BIND:-127.0.0.1}:${GODSPEED_CANDIDATE_HTTPS_PORT:-48443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - candidate-tls:/data
    networks: [candidate]
networks:
  candidate: {}
volumes:
  candidate-data: {}
  candidate-tls: {}
