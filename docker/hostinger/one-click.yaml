# Public Godspeed Mission Control installer for Hostinger Docker template 1210.
# Generated by node docker/hostinger/installer/public-compose.mjs.
# No buyer credentials or setup fields belong in this file.
# The server generates its own private code. The website releases account setup
# only after Hostinger confirms that the signed-in person owns this server.
name: godspeed-mission-control
services:
  godspeed:
    image: ghcr.io/michaelzelbel/godspeed-mission-control@sha256:9a82b0697c6025113dd18871e7645ae47afd0fa8bce525d606eb9ea963401215
    restart: unless-stopped
    init: true
    environment:
      GODSPEED_DEVICE: vps
      GODSPEED_COMPUTER: "off"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "if [ ! -s /opt/data/full-candidate/.install-setup-code ]; then (umask 077; node -e 'process.stdout.write(require(\"crypto\").randomBytes(32).toString(\"hex\"))' > /opt/data/full-candidate/.install-setup-code); fi; GODSPEED_ACCESS_TOKEN=$$(cat /opt/data/full-candidate/.install-setup-code); export GODSPEED_ACCESS_TOKEN; node -e 'const fs=require('\\''fs'\\'');let h=fs.readFileSync(\"/run/godspeed-vps-hostname\",'\\''utf8'\\'').trim();if(/^srv[0-9]+$/.test(h))h+='\\''.hstgr.cloud'\\'';if(!/^srv[0-9]+\\.hstgr\\.cloud$/.test(h))throw Error('\\''Hostinger server address could not be detected'\\'');const setup=process.env.GODSPEED_ACCESS_TOKEN;if(!/^[a-f0-9]{64}$/.test(setup||'\\'''\\''))throw Error('\\''Private setup code could not be loaded'\\'');async function register(){for(let i=0;i<180;i++){try{const r=await fetch('\\''http://127.0.0.1:47831/health'\\'',{signal:AbortSignal.timeout(3000)});if(r.ok){const registered=await fetch(\"https://godspeedmissioncontrol.com/godspeed-install/api/servers/register\",{method:'\\''POST'\\'',headers:{'\\''content-type'\\'':'\\''application/json'\\''},body:JSON.stringify({hostname:h,setup}),redirect:'\\''error'\\'',signal:AbortSignal.timeout(10000)});if(registered.status===202)return;}}catch{}await new Promise(r=>setTimeout(r,5000));}console.error('\\''Automatic account setup could not reach the Godspeed installation page.'\\'');}register();' & exec /opt/godspeed/kit/docker/full-candidate/entrypoint.sh"
    volumes:
      - godspeed-data:/opt/data/full-candidate
      - /etc/hostname:/run/godspeed-vps-hostname:ro
    expose: ["47831"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  https:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "h=$$(cat /run/godspeed-vps-hostname | tr -d '\\r\\n'); printf '%s' \"$$h\" | grep -Eq '^srv[0-9]+(\\.hstgr\\.cloud)?$$' || { echo 'Hostinger server address could not be detected' >&2; exit 1; }; case \"$$h\" in *.hstgr.cloud) ;; *) h=\"$$h.hstgr.cloud\";; esac; printf '%s\\n' '{' '  admin off' '}' \"$$h {\" '  tls {' '    issuer acme {' '      disable_http_challenge' '    }' '  }' '  reverse_proxy godspeed:47831' '}' > /tmp/godspeed-Caddyfile; exec caddy run --adapter caddyfile --config /tmp/godspeed-Caddyfile"
    expose: ["443"]
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.godspeed-mission-control.rule: "HostSNIRegexp(`^srv[0-9]+\\.hstgr\\.cloud$$`)"
      traefik.tcp.routers.godspeed-mission-control.entrypoints: websecure
      traefik.tcp.routers.godspeed-mission-control.tls.passthrough: "true"
      traefik.tcp.routers.godspeed-mission-control.service: godspeed-mission-control
      traefik.tcp.services.godspeed-mission-control.loadbalancer.server.port: "443"
    volumes:
      - godspeed-certificates:/data
      - godspeed-proxy-config:/config
      - /etc/hostname:/run/godspeed-vps-hostname:ro
    depends_on:
      godspeed: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  godspeed-data: {}
  godspeed-certificates: {}
  godspeed-proxy-config: {}
