<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14202c; }
      #root {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: "Archivo Black", Arial Black, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 40%, #2f4a62 0%, #14202c 70%);
      }
      @font-face { font-family: "Archivo Black"; src: url("ArchivoBlack-Regular.ttf"); }
      #stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #kicker { color: #FFE726; font-size: 44px; letter-spacing: 0.12em; text-transform: uppercase; }
      #title { color: #ffffff; font-size: 112px; line-height: 1.02; text-align: center; margin-top: 28px; }
      #rule { width: 0; height: 10px; background: #FFE726; margin-top: 48px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="stack" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <div id="kicker">mc-video</div>
        <h1 id="title">Your mission control<br />made this</h1>
        <div id="rule"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.to("#rule", { width: 420, duration: 0.8, ease: "power2.inOut" }, 0.8);
      tl.to("#root", { opacity: 0, duration: 0.4, ease: "power1.in" }, 2.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
